<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="socSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051532"/>
      <stop offset="35%" stop-color="#0e2a63"/>
      <stop offset="70%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <linearGradient id="socGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Torch Flame Gradient -->
    <linearGradient id="torchFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="30%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Radiance Aura -->
    <radialGradient id="socAura" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#1d4ed8" stop-opacity="0.2"/>
      <stop offset="85%" stop-color="#08152e" stop-opacity="0"/>
    </radialGradient>

    <filter id="socGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1600" height="700" fill="url(#socSky)"/>
  <rect width="1600" height="700" fill="url(#socAura)"/>

  <!-- Distant Scenic Landscape: Villages, Schools, Green Fields & Modern Towns -->
  <g opacity="0.2" fill="#93c5fd">
    <rect x="0" y="590" width="1600" height="110" fill="#061226"/>
    <!-- Village & School rooftops with Indian Flag -->
    <polygon points="120,590 150,560 180,590"/>
    <polygon points="190,590 225,550 260,590"/>
    <polygon points="270,590 310,545 350,590"/>

    <!-- School Flagpole -->
    <line x1="225" y1="550" x2="225" y2="520" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="225,520 245,528 225,536" fill="#ff9933"/>

    <!-- Gentle rural hills & trees -->
    <circle cx="450" cy="590" r="45"/>
    <circle cx="510" cy="590" r="55"/>
    <circle cx="570" cy="590" r="40"/>
    <circle cx="630" cy="590" r="50"/>

    <!-- Rising Sun of Education and Social Unity -->
    <circle cx="780" cy="590" r="70" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <line x1="780" y1="500" x2="780" y2="520" stroke="#f59e0b" stroke-width="2"/>
    <line x1="715" y1="525" x2="730" y2="540" stroke="#f59e0b" stroke-width="2"/>
    <line x1="845" y1="525" x2="830" y2="540" stroke="#f59e0b" stroke-width="2"/>
  </g>

  <!-- Left Side Atmospheric Circle Motif -->
  <g opacity="0.22">
    <circle cx="150" cy="180" r="140" fill="none" stroke="url(#socGold)" stroke-width="1.5" stroke-dasharray="8 6"/>
    <!-- Scales of justice silhouette -->
    <path d="M 120 190 L 180 190 M 150 150 L 150 200" stroke="url(#socGold)" stroke-width="2"/>
    <circle cx="150" cy="180" r="110" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- RIGHT SCENIC DISPLAY: Community Unity & Development Medallion -->
  <g transform="translate(1200, 350)">
    <!-- Outer Radiant Halo -->
    <circle cx="0" cy="0" r="260" fill="none" stroke="url(#socGold)" stroke-width="2" stroke-dasharray="12 8" opacity="0.6"/>
    <circle cx="0" cy="0" r="240" fill="#0f2b5c" stroke="url(#socGold)" stroke-width="3.5" filter="url(#socGlow)"/>

    <!-- Ring of Unity: Circle of Joined Hands & People Holding Hands -->
    <circle cx="0" cy="0" r="225" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 4" opacity="0.75"/>
    <circle cx="0" cy="0" r="215" fill="none" stroke="url(#socGold)" stroke-width="1.5"/>

    <!-- Inner Medallion Canvas -->
    <circle cx="0" cy="0" r="205" fill="#07193b"/>

    <!-- Central Symbolic Artwork: Torch of Education & Open Book of Knowledge -->
    <!-- Open Book of Learning (शिक्षा की पुस्तक) -->
    <g transform="translate(0, 70)">
      <!-- Left Page -->
      <path d="M 0 0 C -40 -15, -80 -10, -110 5 L -100 45 C -75 30, -35 25, 0 35 Z" fill="#ffffff" stroke="url(#socGold)" stroke-width="2"/>
      <!-- Right Page -->
      <path d="M 0 0 C 40 -15, 80 -10, 110 5 L 100 45 C 75 30, 35 25, 0 35 Z" fill="#ffffff" stroke="url(#socGold)" stroke-width="2"/>
      <!-- Book Spine -->
      <line x1="0" y1="0" x2="0" y2="40" stroke="url(#socGold)" stroke-width="3"/>
      <!-- Text Lines in Book -->
      <line x1="-90" y1="18" x2="-20" y2="10" stroke="#93c5fd" stroke-width="2"/>
      <line x1="-85" y1="28" x2="-20" y2="20" stroke="#93c5fd" stroke-width="2"/>
      <line x1="20" y1="10" x2="90" y2="18" stroke="#93c5fd" stroke-width="2"/>
      <line x1="20" y1="20" x2="85" y2="28" stroke="#93c5fd" stroke-width="2"/>
    </g>

    <!-- Flaming Torch of Enlightenment (ज्ञान की मशाल) -->
    <g transform="translate(0, -30)">
      <!-- Torch Handle in Rich Gold & Deep Blue -->
      <path d="M -10 35 L 10 35 L 7 90 L -7 90 Z" fill="url(#socGold)"/>
      <rect x="-14" y="25" width="28" height="12" rx="3" fill="#1e3a8a" stroke="url(#socGold)" stroke-width="1.5"/>
      <polygon points="-16,25 16,25 22,0 -22,0" fill="url(#socGold)"/>

      <!-- Radiant Flame -->
      <path d="M 0 -80 C 25 -45, 30 -20, 18 0 C 8 10, -8 10, -18 0 C -30 -20, -25 -45, 0 -80 Z" fill="url(#torchFlame)" filter="url(#socGlow)"/>
      <!-- Inner Golden Flame Core -->
      <path d="M 0 -60 C 14 -35, 16 -15, 8 0 C 4 5, -4 5, -8 0 C -16 -15, -14 -35, 0 -60 Z" fill="#fef08a"/>
    </g>

    <!-- Circle of Unity: Joined Figures on Outer Rim -->
    <g opacity="0.85" fill="#fef08a">
      <!-- 7 United Figures representing community solidarity -->
      <g transform="translate(-130, -70)">
        <circle cx="0" cy="0" r="9"/>
        <path d="M -12 24 C -12 12, 12 12, 12 24 Z"/>
      </g>
      <g transform="translate(-155, 0)">
        <circle cx="0" cy="0" r="9"/>
        <path d="M -12 24 C -12 12, 12 12, 12 24 Z"/>
      </g>
      <g transform="translate(-130, 70)">
        <circle cx="0" cy="0" r="9"/>
        <path d="M -12 24 C -12 12, 12 12, 12 24 Z"/>
      </g>
      <g transform="translate(130, -70)">
        <circle cx="0" cy="0" r="9"/>
        <path d="M -12 24 C -12 12, 12 12, 12 24 Z"/>
      </g>
      <g transform="translate(155, 0)">
        <circle cx="0" cy="0" r="9"/>
        <path d="M -12 24 C -12 12, 12 12, 12 24 Z"/>
      </g>
      <g transform="translate(130, 70)">
        <circle cx="0" cy="0" r="9"/>
        <path d="M -12 24 C -12 12, 12 12, 12 24 Z"/>
      </g>
    </g>

    <!-- Respectful Title Plaque at Base -->
    <g transform="translate(0, 160)">
      <rect x="-115" y="-14" width="230" height="38" rx="6" fill="#1e3a8a" stroke="url(#socGold)" stroke-width="2"/>
      <text x="0" y="11" text-anchor="middle" fill="url(#socGold)" font-size="13" font-family="serif" font-weight="bold" letter-spacing="1">
        एकता • शिक्षा • सम्मान • विकास
      </text>
    </g>

    <!-- Golden Laurel Branches at Base of Medallion -->
    <g stroke="url(#socGold)" stroke-width="2" fill="none" opacity="0.85">
      <path d="M -150 170 C -100 240, 100 240, 150 170"/>
      <circle cx="-130" cy="190" r="5" fill="#fbbf24"/>
      <circle cx="-90" cy="220" r="6" fill="#fbbf24"/>
      <circle cx="-45" cy="235" r="6" fill="#fbbf24"/>
      <circle cx="0" cy="240" r="7" fill="#fbbf24"/>
      <circle cx="45" cy="235" r="6" fill="#fbbf24"/>
      <circle cx="90" cy="220" r="6" fill="#fbbf24"/>
      <circle cx="130" cy="190" r="5" fill="#fbbf24"/>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="694" width="1600" height="6" fill="url(#socGold)"/>
</svg>
