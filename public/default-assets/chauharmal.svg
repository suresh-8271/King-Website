<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradChauhar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" rx="32" fill="url(#bgGradChauhar)"/>
  <circle cx="300" cy="300" r="275" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Radiant Sun of Swabhimaan / Valour in the Sky -->
  <circle cx="300" cy="210" r="130" fill="url(#sunGrad)" opacity="0.25"/>
  <circle cx="300" cy="210" r="100" fill="url(#sunGrad)" opacity="0.45"/>

  <!-- Sun Rays of Dignity -->
  <g stroke="#fbbf24" stroke-width="2.5" opacity="0.5">
    <line x1="300" y1="80" x2="300" y2="100"/>
    <line x1="300" y1="320" x2="300" y2="340"/>
    <line x1="170" y1="210" x2="190" y2="210"/>
    <line x1="410" y1="210" x2="430" y2="210"/>
    <line x1="208" y1="118" x2="222" y2="132"/>
    <line x1="378" y1="288" x2="392" y2="302"/>
    <line x1="208" y1="302" x2="222" y2="288"/>
    <line x1="378" y1="132" x2="392" y2="118"/>
  </g>

  <!-- Traditional Warrior & Protector Symbols -->
  <!-- Cross Swords (तलवार - साहस एवं रक्षा का प्रतीक) -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <!-- Sword 1 -->
    <line x1="150" y1="120" x2="450" y2="420"/>
    <!-- Guard & Hilt 1 -->
    <line x1="180" y1="130" x2="160" y2="170" stroke="#f59e0b" stroke-width="8"/>
    <circle cx="140" cy="110" r="10" fill="#f59e0b"/>

    <!-- Sword 2 -->
    <line x1="450" y1="120" x2="150" y2="420"/>
    <!-- Guard & Hilt 2 -->
    <line x1="420" y1="130" x2="440" y2="170" stroke="#f59e0b" stroke-width="8"/>
    <circle cx="460" cy="110" r="10" fill="#f59e0b"/>
  </g>

  <!-- Central Shield of Self-Respect (स्वाभिमान की ढाल) -->
  <g transform="translate(300, 260)">
    <!-- Outer Shield Shape -->
    <path d="M 0 -130 C 90 -130, 110 -60, 110 30 C 110 110, 50 160, 0 190 C -50 160, -110 110, -110 30 C -110 -60, -90 -130, 0 -130 Z" fill="url(#shieldGrad)" stroke="#fef08a" stroke-width="6"/>
    <!-- Inner Shield Inset -->
    <path d="M 0 -115 C 75 -115, 92 -50, 92 25 C 92 95, 40 140, 0 168 C -40 140, -92 95, -92 25 C -92 -50, -75 -115, 0 -115 Z" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>

    <!-- Sacred Eternal Flame (साहस एवं स्वाभिमान की अखंड ज्योति) inside Shield -->
    <path d="M 0 100 C 35 100, 45 40, 20 0 C 40 -30, 0 -80, 0 -95 C 0 -80, -40 -30, -20 0 C -45 40, -35 100, 0 100 Z" fill="#ea580c"/>
    <path d="M 0 95 C 24 95, 30 50, 14 20 C 26 -2, 0 -45, 0 -60 C 0 -45, -26 -2, -14 20 C -30 50, -24 95, 0 95 Z" fill="#f59e0b"/>
    <path d="M 0 85 C 14 85, 18 55, 8 35 C 15 20, 0 -15, 0 -25 C 0 -15, -15 20, -8 35 C -18 55, -14 85, 0 85 Z" fill="#fef08a"/>

    <!-- Om/Swastik/Star of Valour -->
    <circle cx="0" cy="115" r="8" fill="#fde047"/>
    <circle cx="-50" cy="-30" r="6" fill="#fde047"/>
    <circle cx="50" cy="-30" r="6" fill="#fde047"/>
  </g>

  <!-- Banner Ribbon at Bottom -->
  <g transform="translate(0, 515)">
    <rect x="40" y="0" width="520" height="60" rx="14" fill="#1c1917" stroke="#f59e0b" stroke-width="2"/>
    <text x="300" y="27" fill="#fbbf24" font-family="'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="18" font-weight="900" text-anchor="middle">
      वीर शिरोमणि बाबा चौहरमल
    </text>
    <text x="300" y="48" fill="#fed7aa" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="12" font-weight="600" text-anchor="middle">
      लोक-नायक • स्वाभिमान, साहस व सामाजिक एकता के अमर प्रतीक
    </text>
  </g>
</svg>
