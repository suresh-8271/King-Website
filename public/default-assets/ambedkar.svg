<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" rx="32" fill="url(#bgGrad)"/>
  <circle cx="300" cy="300" r="275" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="10 6" opacity="0.6"/>

  <!-- Halo / Aura -->
  <circle cx="300" cy="240" r="140" fill="#3b82f6" opacity="0.18"/>
  <circle cx="300" cy="240" r="120" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Ashoka Chakra Spokes in Aura (Symbol of Constitution and Dharma) -->
  <g transform="translate(300, 240) scale(0.9)" opacity="0.35">
    <circle cx="0" cy="0" r="110" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="0" cy="0" r="16" fill="#60a5fa"/>
    <!-- 24 Spokes -->
    <g stroke="#93c5fd" stroke-width="1.5">
      <line x1="0" y1="-110" x2="0" y2="110"/>
      <line x1="-110" y1="0" x2="110" y2="0"/>
      <line x1="-77.8" y1="-77.8" x2="77.8" y2="77.8"/>
      <line x1="-77.8" y1="77.8" x2="77.8" y2="-77.8"/>
      <line x1="-42.1" y1="-101.6" x2="42.1" y2="101.6"/>
      <line x1="-101.6" y1="-42.1" x2="101.6" y2="42.1"/>
      <line x1="-101.6" y1="42.1" x2="101.6" y2="-42.1"/>
      <line x1="-42.1" y1="101.6" x2="42.1" y2="-101.6"/>
      <line x1="-95.3" y1="-55" x2="95.3" y2="55"/>
      <line x1="-55" y1="-95.3" x2="55" y2="95.3"/>
      <line x1="-55" y1="95.3" x2="55" y2="-95.3"/>
      <line x1="-95.3" y1="55" x2="95.3" y2="-55"/>
    </g>
  </g>

  <!-- Blue Coat & Dignified Silhouette -->
  <!-- Shoulders / Coat -->
  <path d="M 120 520 C 135 410, 200 370, 250 365 L 275 425 L 325 425 L 350 365 C 400 370, 465 410, 480 520 Z" fill="url(#coatGrad)"/>
  <!-- White Shirt Collar & Red Tie -->
  <polygon points="275,365 325,365 315,445 285,445" fill="#ffffff"/>
  <polygon points="293,375 307,375 304,440 296,440" fill="#dc2626"/>
  <!-- Coat Lapels -->
  <path d="M 230 375 L 278 445 L 260 520" fill="none" stroke="#172554" stroke-width="4"/>
  <path d="M 370 375 L 322 445 L 340 520" fill="none" stroke="#172554" stroke-width="4"/>

  <!-- Neck -->
  <rect x="278" y="300" width="44" height="65" fill="#fcd34d" rx="8"/>

  <!-- Head / Face Structure -->
  <ellipse cx="300" cy="235" rx="56" ry="70" fill="#fcd34d"/>
  <!-- Hair -->
  <path d="M 242 225 C 242 165, 270 160, 300 160 C 330 160, 358 165, 358 225 C 352 185, 325 170, 300 170 C 275 170, 248 185, 242 225 Z" fill="#1e293b"/>
  <!-- Glasses (Iconic Round/Oval Frame) -->
  <rect x="262" y="215" width="30" height="22" rx="6" fill="none" stroke="#1e293b" stroke-width="3.5"/>
  <rect x="308" y="215" width="30" height="22" rx="6" fill="none" stroke="#1e293b" stroke-width="3.5"/>
  <line x1="292" y1="225" x2="308" y2="225" stroke="#1e293b" stroke-width="3.5"/>
  <line x1="250" y1="222" x2="262" y2="225" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="338" y1="225" x2="350" y2="222" stroke="#1e293b" stroke-width="2.5"/>

  <!-- Features: Eyebrows, Nose, Dignified Calm Smile -->
  <path d="M 265 210 Q 278 206 290 210" fill="none" stroke="#78350f" stroke-width="2"/>
  <path d="M 310 210 Q 322 206 335 210" fill="none" stroke="#78350f" stroke-width="2"/>
  <path d="M 299 228 L 297 248 L 303 248" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 288 268 Q 300 274 312 268" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Constitution Book held under arm/front -->
  <g transform="translate(195, 435)">
    <rect x="0" y="0" width="210" height="85" rx="8" fill="#7f1d1d" stroke="url(#goldGrad)" stroke-width="3"/>
    <rect x="12" y="10" width="186" height="65" rx="4" fill="#991b1b"/>
    <!-- Gold Embossing on Book -->
    <text x="105" y="38" fill="#fde047" font-family="'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="1">
      भारत का संविधान
    </text>
    <text x="105" y="58" fill="#fef08a" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="1">
      CONSTITUTION OF INDIA
    </text>
  </g>

  <!-- Bottom Banner Ribbon -->
  <g transform="translate(0, 520)">
    <rect x="40" y="0" width="520" height="56" rx="14" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2"/>
    <text x="300" y="27" fill="#fbbf24" font-family="'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="17" font-weight="900" text-anchor="middle">
      बोधिसत्व डॉ. भीमराव अंबेडकर
    </text>
    <text x="300" y="47" fill="#93c5fd" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif" font-size="11" font-weight="600" text-anchor="middle">
      संविधान निर्माता • भारत रत्न • सामाजिक न्याय के प्रणेता
    </text>
  </g>
</svg>
